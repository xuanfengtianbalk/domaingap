MODEL:
  INIT_WEIGHTS: true
  TYPE: [] # coordinates, softass, keypoints_gs, keypoints_set
  BACKBONE: "dinov3" # swin transformer
  BACKBONE_NAME: "dinov3_vits16"
  DECODE_HEAD: "SegformerHead" #BNHead
  OUTPUT_CHANNELS: 11
  ACTIVATE: 'None' # None, sigmoid, softmax...
  # bin converter for coordinates_gs
  BIN_CONVERTER:
    SAMPLE_RANGE: [-0.7, 0.7]
    N_PER_UNIT: 30
    SIGMA_FACTOR: 1.5
    LOSS_REDUCTION: 'mean'  # mean (per-pixel avg) or sum (per-pixel sum then avg)
    USE_MASK: False   # use mask head for coordinates_gs
  PEFT:
    method: none           # none, ssf, lora, ssf+lora
    lora_rank: 4
    vpt_n_prompts: 10

EVIDENTIAL:
  lamb: 0.001
  active: exp
  threshold: 0.0

EVIDENTIAL_CLS:
  lamb: 0.001
  threshold: 0.0

STABLE_LEARNING:
  enable: false             # sample reweighting on/off (train_script=train_stable)
  num_f: 1                  # number of fourier spaces
  rff_sigma: 1.0            # RFF W = randn/sigma (smaller sigma = finer frequencies)
  n_feature: 16             # global table size (pre-saved features), should equal TRAIN.BATCH_SIZE
  epochb: 20                # inner balancing iterations per batch
  lrbl: 1.0                 # sample weight learning rate (SGD momentum 0.9)
  lambdap: 70.0             # divisor of decorrelation loss (annealed)
  decay_pow: 2              # weight penalty exponent: sum softmax(w)^decay_pow
  presave_ratio: 0.9        # global table EMA: 0.9*old + 0.1*new
  epochp: 0                 # pretrain epochs with uniform weights
  lambda_decay_rate: 1      # lambdap decay rate per lambda_decay_epoch
  lambda_decay_epoch: 5
  min_lambda_times: 0.01
  first_step_cons: 1        # constraint factor at first epoch

L2SDG:
  enable: false             # WAE adversarial augmentation on/off (train_script=train_l2sdg)
  latent_dim: 128           # WAE latent dim
  epsilon: 8.0              # pixel-space perturbation bound (/255)
  beta: 0.5                 # clean-image task loss weight in meta objective
  lambda_norm: 1e-4         # perturbation magnitude penalty
  lambda_mmd: 1e-3          # MMD (WAE prior) penalty
  perturb_steps: 1          # inner adversarial steps
  wae_lr: 1e-3              # WAE optimizer lr

TRAIN:
  LR: 5e-4
  OPTIM: 'AdamW'
  MAX_EPOCH: 1
  SAVE_DIR: 'workingdir'
  BATCH_SIZE: 16
  P_AUG_SUN: 0.0
  AUG_TYPE: 'none'          # aug1-4, aug5, augmix, styleaug
  STYLEAUG_P: 0.0           # probability of applying StyleAugmentor
  STYLEAUG_ALPHA: 0.3       # style mixing strength
  MIXSTYLE: false  # MixStyle domain generalization (default off)
  MIXSTYLE_P: 0.5
  MIXSTYLE_ALPHA: 0.1
  USE_CONVEX_HULL: true  # use convex hull for keypoint visibility (default on)
  RAND_CONV_P: 0.5       # prob of keeping original image (only when RAND_CONV_MIX=false)
  RAND_CONV_MIX: true    # if true, always RandConv then α-blend with original
  RAND_CONV_CONSISTENCY: 1  # weight for consistency loss (KL between 3 RandConv branches)
  RAND_CONV_N_BRANCHES: 3  # number of independent RandConv forward passes per image
  CONSISTENCY_TYPE: randconv  # 'randconv', 'aug', or 'patch_mask'

TEST:
  SAVE_DIR: 'test'

DATASET:
  NAME: "speedplus"
  train_root_dir: './datasets/speedplus/speedplus'
  val_root_dir: './datasets/speedplus/speedplus'
  test_root_dir: './datasets/speedplus/speedplus'
  NUM_KEYPOINTS: 11
