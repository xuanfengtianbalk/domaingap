# Analysis configuration
# Run: cd analysis && python analyzer.py

mode: pairwise

pairwise:
  uuid_1: "e24d72fb-b4d7-4c40-b00a-a4aa2f8213e8"
  uuid_2: "ec59650b-44d2-4da5-b4e4-8e2f84237cd8"
  splits: [sunlamp, lightbox, validation]
  max_samples: 10000
metrics:
  - correlation
  - winrate
  - direction
  - mae_rmse
  - error_gain
  - per_axis
  - fusion
  - calibration
  - bias_analysis

# Conditions to apply to all metrics
conditions:
  - overall
  - low_epi
  - mid_epi
  - high_epi

# Visualization to generate
visualization:
  - scatter
  - histogram
  - epi_winrate
  - calibration_error
  - calibration_gain
  - threshold_sweep
  - fusion_summary
  - sign_agreement
  - bias_magnitude
  - disagreement_ratio
  - gt_conditioned
  - ct_vs_uncertainty
  - alpha_correct_vs_unc

# GT coordinate ranges from speed_satellite_normed.glb
# x/y/z mapping: data_x=GLB_X, data_y=GLB_Z, data_z=GLB_Y
gt_ranges:
  x: [-0.57, 0.57]
  y: [-0.52, 0.60]
  z: [0.00, 0.33]
  bin_step: 0.05
