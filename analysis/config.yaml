# Analysis configuration
# Run: cd analysis && python analyzer.py

mode: pairwise

pairwise:
  uuid_1: "e24d72fb-b4d7-4c40-b00a-a4aa2f8213e8"
  uuid_2: "ec59650b-44d2-4da5-b4e4-8e2f84237cd8"
  splits: [sunlamp, lightbox]
  max_samples: 10000
metrics:
  - correlation
  - winrate
  - direction
  - mae_rmse
  - error_gain
  - per_axis
  - fusion
  - calibration
  - bias_analysis

# Conditions to apply to all metrics
conditions:
  - overall
  - low_epi
  - mid_epi
  - high_epi

# Visualization to generate
visualization:
  - scatter
  - histogram
  - epi_winrate
  - calibration_error
  - calibration_gain
  - threshold_sweep
  - fusion_summary
  - bias_pearson_vs_epi
  - bias_magnitude_vs_epi
  - bias_drift
  - bias_combined
  - bias_angle_vs_epi
